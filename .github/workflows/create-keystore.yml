

name: Create PRINCE TV Signing Key

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up signing key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_NAME: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_NAME"

          keytool -genkeypair -v \
            -keystore prince-tv-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_NAME" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PRINCE TV, OU=Android, O=PRINCE, L=Dar es Salaam, ST=Dar es Salaam, C=TZ"

          base64 -w 0 prince-tv-release.jks > keystore-base64.txt

      - name: Upload signing key data
        uses: actions/upload-artifact@v4
        with:
          name: PRINCE-TV-KEYSTORE-DATA
          path: keystore-base64.txt
          retention-days: 1
